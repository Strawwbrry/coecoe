<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>One last secret</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="secret-page">
<header class="minimal-head"><span>05 / 06</span><span>A LITTLE GAME</span></header>
<main class="secret-main">
  <span class="chapter">CHAPTER FIVE</span>
  <h1>Do you remember<br><i>this one?</i></h1>
  <p>Answer the tiny question to unlock the last page.</p>
  <div class="question-card">
    <small>YOUR QUESTION</small>
    <h2>What is our first date?</h2>
    <div class="answers">
      <button data-answer="no">27.10.2023</button>
      <button data-answer="yes">26.10.2023</button>
      <button data-answer="no">25.10.2023</button>
    </div>
    <div id="result"></div>
  </div>
</main>
<script src="js/guard.js"></script>
<script>
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{
 const result=document.querySelector('#result');
 if(b.dataset.answer==='yes'){result.textContent='You remembered. ♡';result.className='good';setTimeout(()=>location.href='final.html',900)}
 else {result.textContent='Not that one… try again.';result.className='bad'}
});
</script>
</body>
</html>
