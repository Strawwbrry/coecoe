<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>For You — A Secret Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login">
<div class="grain"></div>
<main class="login-stage">
  <section class="login-visual">
    <div class="photo-frame">
  
</div>
    <div class="visual-copy">
      <span>FOR YOUR EYES ONLY</span>
      <h1>There is<br><em>something</em><br>waiting for you.</h1>
     
    </div>
    <div class="date-stamp">27 · 10 · 2007</div>
  </section>

  <section class="login-panel">
    <div class="panel-top">
      <span class="tiny-label">A PRIVATE LITTLE PLACE</span>
      <span class="lock">⌑</span>
    </div>
    <div class="login-title">
      <div class="star">✦</div>
      <h2>Enter the<br><i>secret code</i></h2>
      <p>Hint : Our anniversary date</p>
    </div>

    <div class="pin" id="pin">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="message" id="message">7 digits</div>

    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="soft" data-k="clear">⌫</button><button data-k="0">0</button><button class="soft" data-k="enter">↵</button>
    </div>

    <div class="login-bottom">
      <span>tap gently</span>
      <span>♡</span>
      <span>made for one</span>
    </div>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
